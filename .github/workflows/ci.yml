---
name: ci

# yamllint disable-line rule:truthy
on:
  # Branches in this repository get tested through their pull requests.
  push:
    branches:
      - devel
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ci-${{github.workflow}}-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

jobs:
  prechecks:
    uses: $/.github/workflows/pre-commit.yml
    permissions:
      issues: write # for label manipulation
      pull-requests: write # for label manipulation
  all-prechecks:
    needs: [prechecks]
    name: CI precheck success
    runs-on: ubuntu-26.04
    steps:
      - name: Success
        run: "true"
  tests:
    needs: [all-prechecks]
    uses: $/.github/workflows/test-matrix-github.yml
    permissions:
      packages: write # to save ccache in ghcr.io
  # TODO uncomment all the following lines when AT2 runners are set up.
  #
  # at2-tests:
  #   needs: [all-prechecks]
  #   uses: $/.github/workflows/test-matrix-at2.yml
  #   permissions:
  #     packages: write
  all-tests:
    # needs: [tests, at2-tests]
    needs: [tests]
    name: CI success
    runs-on: ubuntu-26.04
    steps:
      - name: Success
        run: "true"
