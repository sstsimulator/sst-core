---
name: sst-core build/install/test on free runners

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      test-categories:
        description: >-
          Space-separated test categories; jobs that only run nightly need
          "nightly" in it
        default: pr
        type: string

concurrency:
  group: test-matrix-github-${{github.workflow}}-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

# Jobs that build the same configuration share a ccache-key, and only one of
# them must save it; check this when adding or removing jobs.
jobs:
  rocky8-mpi-mr-2:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:8
      test-ranks: 2
      ccache-key: rocky8-mpi-gcc
      ccache-save: true
      artifact-name: rocky8-mpi-mr-2
  rocky9-mpi:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      ccache-key: rocky9-mpi-gcc
      ccache-save: true
      artifact-name: rocky9-mpi
  rocky9-mpi-clang:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      toolchain: clang
      ccache-key: rocky9-mpi-clang
      ccache-save: true
      artifact-name: rocky9-mpi-clang
  rocky9-mpi-make-dist:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      make-dist: true
      ccache-key: rocky9-mpi-gcc
      artifact-name: rocky9-mpi-make-dist
  rocky9-mpi-mr-2:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      test-ranks: 2
      ccache-key: rocky9-mpi-gcc
      artifact-name: rocky9-mpi-mr-2
  rocky9-mpi-mr-2-mt-2:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      test-ranks: 2
      test-threads: 2
      ccache-key: rocky9-mpi-gcc
      artifact-name: rocky9-mpi-mr-2-mt-2
  rocky9-mpi-mt-2:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      test-threads: 2
      ccache-key: rocky9-mpi-gcc
      artifact-name: rocky9-mpi-mt-2
  rocky9-nompi:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      mpi: false
      ccache-key: rocky9-nompi-gcc
      ccache-save: true
      artifact-name: rocky9-nompi
  # Left out in favor of rocky10-nompi while we debug OpenMPI 5
  #
  # rocky10-mpi-mr-2:
  #   uses:
  #     $/.github/workflows/sst-ci-job.yml
  #   permissions:
  #     packages: write # to save ccache
  #   with:
  #     runs-on: ubuntu-26.04
  #     test-categories: ${{ inputs.test-categories }}
  #     image: rockylinux/rockylinux:10
  #     test-ranks: 2
  #     ccache-key: rocky10-mpi-gcc
  #     ccache-save: true
  #     artifact-name: rocky10-mpi-mr-2
  rocky10-mpi:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:10
      ccache-key: rocky10-mpi-gcc
      ccache-save: true
      artifact-name: rocky10-mpi
  ubuntu2404-mpi:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: ubuntu:24.04
      ccache-key: ubuntu2404-mpi-gcc
      ccache-save: true
      artifact-name: ubuntu2404-mpi
  ubuntu2604-mpi:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: ubuntu:26.04
      ccache-key: ubuntu2604-mpi-gcc
      ccache-save: true
      artifact-name: ubuntu2604-mpi
  macos-15:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: macos-15
      test-categories: ${{ inputs.test-categories }}
      python-version: '3.13'
      ccache-key: macos-15
      ccache-save: true
      artifact-name: macos-15
  macos-26:
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: macos-26
      test-categories: ${{ inputs.test-categories }}
      python-version: '3.13'
      ccache-key: macos-26
      ccache-save: true
      artifact-name: macos-26
  # The jobs below run only in the nightly workflow.
  rocky9-mpi-mr-4:
    if: ${{ contains(inputs.test-categories, 'nightly') }}
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      test-ranks: 4
      ccache-key: rocky9-mpi-gcc
      artifact-name: rocky9-mpi-mr-4
  rocky9-mpi-mt-4:
    if: ${{ contains(inputs.test-categories, 'nightly') }}
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      test-threads: 4
      ccache-key: rocky9-mpi-gcc
      artifact-name: rocky9-mpi-mt-4
  rocky9-mpi-mr-3-mt-2:
    if: ${{ contains(inputs.test-categories, 'nightly') }}
    uses:
      $/.github/workflows/sst-ci-job.yml
    permissions:
      packages: write # to save ccache
    with:
      runs-on: ubuntu-26.04
      test-categories: ${{ inputs.test-categories }}
      image: rockylinux/rockylinux:9
      test-ranks: 3
      test-threads: 2
      # 6 PEs on a runner with 4 hardware threads
      test-oversubscribe: true
      ccache-key: rocky9-mpi-gcc
      artifact-name: rocky9-mpi-mr-3-mt-2
