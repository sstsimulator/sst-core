---
fail_fast: false
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: trailing-whitespace
        # allow it in external dependencies and test references
        exclude: |
          (?x)(
              src/sst/core/libltdl/|
              external/|
              tests/refFiles/
          )
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v20.1.8"
    hooks:
      - id: clang-format
        types_or: [c++, c]
        exclude: |
          (?x)(
              build/|
              src/sst/core/libltdl/|
              external/
          )
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.22"
    hooks:
      - id: ruff-check
  - repo: https://github.com/pre-commit/mirrors-mypy
    # This needs to match the last version that still supports the minimum
    # required Python version
    rev: "v1.19.1"
    hooks:
      - id: mypy
        additional_dependencies:
          - blessings
          - testtools
          - types-Pygments
        # Work around config file setting exclusion rules being bypassed when
        # filenames are explicitly passed on the command line.  See
        # https://github.com/python/mypy/pull/12373#issuecomment-1071662559
        # for the idea.
        args: [.]
        pass_filenames: false
  - repo: https://github.com/kjanat/actionlint
    rev: "v1.17.0"
    hooks:
      - id: actionlint
        additional_dependencies:
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1"
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.0
    hooks:
      - id: zizmor
        args: [--no-progress, --persona=pedantic, --fix=all]
